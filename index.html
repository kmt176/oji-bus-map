<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王子駅バス地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script>
  // ===== 設定（ここだけ書き換える） =====
  // Apps Script をウェブアプリとしてデプロイしたときの URL（…/exec）
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxm3xHEwcC8_Xx-no3T32V9WxGo5yD0xJjQlqBxVGBPGzP6WypqIjeIQmQllGo2pV68/exec';
  // この分数以上遅れている路線を赤く表示する
  const DELAY_ALERT_MIN = 10;
  // 遅れ情報を取り直す間隔（秒）
  const STATUS_INTERVAL_SEC = 150;
</script>
<style>
  :root { --ink:#222; --sub:#666; --bg:#fff; --line:#ddd; --alert:#d50000; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; color:var(--ink); background:var(--bg); }
  body { display:flex; flex-direction:column; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:10px; }
  header h1 { margin:0; font-size:20px; }
  header small { color:var(--sub); font-size:13px; }
  #map { flex:1; min-height:0; }
  #msg { display:none; position:absolute; top:64px; left:12px; right:12px; z-index:1000; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:16px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  #sheet { border-top:1px solid var(--line); max-height:45vh; overflow:auto; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:none; }
  #sheet h2 { margin:0 0 8px; font-size:20px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #sheet h2 button { flex:none; font-size:16px; padding:8px 14px; border:1px solid var(--line); background:#fff; border-radius:8px; }
  #bar { display:flex; gap:6px; padding:8px 14px; border-bottom:1px solid var(--line); }
  #bar button { white-space:nowrap; font-size:15px; padding:10px 8px; border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; }
  #bar #delays.alert { border-color:var(--alert); color:var(--alert); font-weight:700; }
  #bar button.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  #bar .seg { display:flex; flex:1; }
  #bar .seg button { flex:1; }
  #bar .seg button:first-child { border-radius:10px 0 0 10px; }
  #bar .seg button:last-child { border-radius:0 10px 10px 0; border-left:none; }
  #search { display:flex; gap:8px; padding:0 14px 8px; border-bottom:1px solid var(--line); }
  #search input { flex:1; min-width:0; font-size:17px; padding:10px 12px; border:2px solid var(--line); border-radius:10px; }
  #search button { flex:none; width:52px; font-size:22px; border:2px solid var(--line); border-radius:10px; background:#fff; }
  #search button.on { border-color:var(--alert); }
  #bar { border-bottom:none !important; }
  .route small { display:block; color:var(--sub); font-size:14px; margin-top:2px; }
  .row { display:flex; gap:6px; align-items:stretch; margin:6px 0; }
  .row .route { margin:0; }
  .star { flex:none; width:52px; font-size:26px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#bbb; }
  .star.on { color:#e0a800; }
  .route { display:flex; align-items:center; gap:10px; width:100%; text-align:left; font-size:18px; padding:12px 10px; margin:6px 0; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .route.on { border-width:3px; }
  .chip { flex:none; width:14px; height:28px; border-radius:4px; }
  .route b { flex:none; min-width:4.2em; }
  .route span { color:var(--sub); font-size:16px; }
  .route em { margin-left:auto; flex:none; font-style:normal; font-weight:700; font-size:16px; color:var(--alert); }
  .note { color:var(--sub); font-size:13px; margin:8px 2px 0; }
  /* 乗り場のピン：番号の丸（指で押しやすい 44px）の下に乗り場名 */
  .pin { position:absolute; left:0; top:0; transform:translate(-50%,-22px); display:flex; flex-direction:column; align-items:center; }
  .pin i { font-style:normal; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%;
           background:#fff; border:3px solid var(--ink); color:var(--ink); font-size:18px; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .pin span { margin-top:2px; font-size:13px; font-weight:700; white-space:nowrap; color:var(--ink);
              text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .pin.sel i { background:var(--ink); color:#fff; }
  .pin.alert i { border-color:var(--alert); color:var(--alert); }
  .pin.sel.alert i { background:var(--alert); color:#fff; }
  /* まとめ表示（ズームアウト時） */
  .cluster small { font-size:11px; margin-top:2px; }
  .cluster { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; width:56px; height:56px; border-radius:50%; background:var(--ink); color:#fff; border:3px solid #fff;
             font-size:18px; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.3); }
</style>
</head>
<body>
<header><h1>王子駅バス地図</h1><small>都営バスのみ表示</small></header>
<div id="bar">
  <div class="seg"><button id="dirFrom">王子駅から</button><button id="dirTo">王子駅へ</button></div>
  <button id="favOnly">★だけ</button>
  <button id="delays">遅れ</button>
</div>
<div id="search">
  <input id="q" type="search" placeholder="行き先・停留所で探す" enterkeyhint="search" autocomplete="off">
  <button id="mic" aria-label="声で入力">🎤</button>
</div>
<div id="map"></div>
<div id="msg"></div>
<div id="sheet"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const OJI = [35.75282, 139.73784];
// 遅れの赤と見分けやすいよう、赤系は入れない
const PALETTE = ['#3cb44b','#4363d8','#f58231','#911eb4','#42a5b5','#8a6d00','#008080','#9a6324','#000075','#808000','#5e60ce','#2a9d8f'];
const ALERT = '#d50000';

const map = L.map('map', { zoomControl:false, maxZoom:19 }).setView(OJI, 17);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

// 近い乗り場はまとめて表示し、ズームすると分かれる。最大ズームでも重なるときはタップで広がる
const cluster = L.markerClusterGroup({
  maxClusterRadius:80, spiderfyOnMaxZoom:true, showCoverageOnHover:false, spiderfyDistanceMultiplier:3,
  iconCreateFunction: c => L.divIcon({ className:'', html:`<div class="cluster">${c.getChildCount()}<small>乗り場</small></div>`, iconSize:[56,56], iconAnchor:[28,28] })
}).addTo(map);

const msg = document.getElementById('msg');
const sheet = document.getElementById('sheet');
let currentStop = null;
let data, colorOf = {}, lines = {}, pins = {}, stopById = {}, selStop = null, selRoute = null;
let status = {}; // 路線パターンID → { delay, suspended, ... }
let along = [];
let statusAt = null; // 遅れ情報を取った時刻
let delayMode = false; // 遅れ一覧を表示中   // 線の途中のバス停の丸

// 表示の設定（このスマホに覚えておく）
function loadPref(k, def) { try { const v = localStorage.getItem('ojibus.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function savePref(k, v) { try { localStorage.setItem('ojibus.' + k, JSON.stringify(v)); } catch (e) {} }
let dir = loadPref('dir', 'from');          // 'from'＝王子駅から、'to'＝王子駅へ
let favOnly = loadPref('favOnly', false);   // ★の付いた系統だけ表示
let favs = new Set(loadPref('favs', []));   // ★を付けた系統名（例：王40）
const alongRenderer = L.canvas({ tolerance:12 }); // 小さな丸でも指で押しやすくする

function isVisible(r) {
  const okDir = dir === 'from' ? r.fromOji !== false : r.toOji !== false;
  return okDir && (!favOnly || favs.has(r.title)) && matchesQuery(r);
}

// ===== 行き先・停留所名で探す =====
let query = '';
// ひらがなをカタカナにそろえ、空白と「行き」「まで」などの言い回しを取る
function norm(t) {
  return String(t || '').replace(/[\s　]/g, '')
    .replace(/(に行きたい|へ行きたい|に行く|へ行く|行きのバス|のバス|行き|ゆき|方面|まで|行|へ)$/, '')
    .replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
function matchesQuery(r) { return !query || r.names.includes(query); }
// その路線に乗る王子駅の乗り場
function ojiStopsOf(r) { return data.stops.filter(s => s.routes.includes(r.id)); }

function showResults() {
  currentStop = null; delayMode = false;
  const rs = data.routes.filter(isVisible).sort((a, b) => a.title.localeCompare(b.title, 'ja'));
  const shown = document.getElementById('q').value.trim();
  sheet.innerHTML = `<h2>「${esc(shown)}」へ行く路線 ${rs.length}件<button id="close">閉じる</button></h2>` +
    (rs.length ? rs.map(r => {
      const c = isAlert(r.id) ? ALERT : colorOf[r.title];
      const st = ojiStopsOf(r);
      const where = st.length ? '乗り場：' + st.map(stopLabel).join('、') : '';
      return `<div class="row"><button class="route" data-id="${esc(r.id)}" style="border-color:${c}">
        <i class="chip" style="background:${c}"></i><b>${esc(r.title)}</b><span>${esc(destOf(r))}<small>${esc(where)}</small></span>${alertText(r.id) ? `<em>${esc(alertText(r.id))}</em>` : ''}</button></div>`;
    }).join('') : `<p>見つかりませんでした。行き先か、王子駅から4km以内の停留所名で探せます。${dir === 'from' ? '' : '（今は「王子駅へ」を表示中です）'}</p>`);
  sheet.style.display = 'block';
  sheet.querySelectorAll('.route').forEach(b => b.onclick = () => {
    const r = routeById(b.dataset.id), st = ojiStopsOf(r)[0];
    if (st) { openStop(st); cluster.zoomToShowLayer(pins[st.id]); }
    selRoute = null; highlight(r.id);
  });
  document.getElementById('close').onclick = closeStop;
  map.invalidateSize();
}

// 遅れ・運休の可能性がある路線の一覧（遅れが大きい順、運休の可能性は先頭）
function showDelays() {
  currentStop = null; delayMode = true;
  const rs = data.routes.filter(r => isAlert(r.id) && (dir === 'from' ? r.fromOji !== false : r.toOji !== false))
    .sort((a, b) => (isSuspended(b.id) - isSuspended(a.id)) || ((status[b.id].delay || 0) - (status[a.id].delay || 0)));
  const at = statusAt ? `${statusAt.getHours()}:${String(statusAt.getMinutes()).padStart(2, '0')}更新` : 'まだ取得していません';
  sheet.innerHTML = `<h2>遅れ・運休の可能性 ${rs.length}件<button id="close">閉じる</button></h2>` +
    (rs.length ? rs.map(r => {
      const st = ojiStopsOf(r);
      const where = st.length ? '乗り場：' + st.map(stopLabel).join('、') : '';
      return `<div class="row"><button class="route" data-id="${esc(r.id)}" style="border-color:${ALERT}">
        <i class="chip" style="background:${ALERT}"></i><b>${esc(r.title)}</b><span>${esc(destOf(r))}<small>${esc(where)}</small></span><em>${esc(alertText(r.id))}</em></button></div>`;
    }).join('') : `<p>${DELAY_ALERT_MIN}分以上遅れている路線はありません。</p>`) +
    `<p class="note">${esc(at)}（${dir === 'from' ? '王子駅から' : '王子駅へ'}の路線）${rs.some(r => isSuspended(r.id)) ? '<br>※ 運休の可能性は、走っているはずのバスが位置データに見当たらないことからの推測です。' : ''}</p>`;
  sheet.style.display = 'block';
  sheet.querySelectorAll('.route').forEach(b => b.onclick = () => {
    const r = routeById(b.dataset.id), st = ojiStopsOf(r)[0];
    if (st) { openStop(st); cluster.zoomToShowLayer(pins[st.id]); }
    selRoute = null; highlight(r.id);
  });
  document.getElementById('close').onclick = closeStop;
  map.invalidateSize();
}
document.getElementById('delays').onclick = showDelays;
// 遅れのある路線の数をボタンに出す
function updateDelayButton() {
  const n = data.routes.filter(r => isAlert(r.id) && (dir === 'from' ? r.fromOji !== false : r.toOji !== false)).length;
  const b = document.getElementById('delays');
  b.textContent = n ? `遅れ ${n}` : '遅れ';
  b.classList.toggle('alert', n > 0);
}

function runSearch() {
  query = norm(document.getElementById('q').value);
  applyFilter();
  if (query) showResults(); else closeStop();
}
let searchTimer;
document.getElementById('q').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 300); });
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); runSearch(); } });

// 声で入力（対応しているブラウザだけボタンを出す）
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('mic');
if (!SR) micBtn.style.display = 'none';
else micBtn.onclick = () => {
  const rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = false; rec.maxAlternatives = 1;
  micBtn.classList.add('on');
  rec.onresult = e => { document.getElementById('q').value = e.results[0][0].transcript.replace(/[。、]$/, ''); runSearch(); };
  rec.onend = () => micBtn.classList.remove('on');
  rec.onerror = () => { micBtn.classList.remove('on'); showMsgFor('声を聞き取れませんでした。もう一度押して話してください'); };
  rec.start();
};
function routeById(id) { return data.routes.find(r => r.id === id); }

function showMsg(t) { msg.textContent = t; msg.style.display = 'block'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 行き先：路線の備考（例「王40甲:池袋駅東口行」）から取り、なければ終点名
function destOf(r) {
  const m = r.note && r.note.match(/[:：](.+)$/);
  return (m ? m[1] : r.note) || (r.dest ? r.dest + '行' : '');
}
function isDelayed(id) { const s = status[id]; return !!s && s.delay != null && s.delay >= DELAY_ALERT_MIN; }
function isSuspended(id) { const s = status[id]; return !!s && s.suspended; }
function isAlert(id) { return isDelayed(id) || isSuspended(id); }
// 平常時は空。遅れ・運休の可能性があるときだけ文字を返す
function alertText(id) {
  if (isSuspended(id)) return '運休の可能性※';
  if (isDelayed(id)) return `約${status[id].delay}分遅れ`;
  return '';
}

async function load() {
  if (!GAS_URL) { showMsg('バス停の情報を読み込めませんでした'); return; }
  showMsg('バス停の情報を読み込み中…');
  try {
    const res = await fetch(GAS_URL);
    data = await res.json();
    if (data.error || !data.stops || !data.stops.length) throw new Error(data.error || 'empty');
  } catch (e) {
    console.error(e);
    showMsg('バス停の情報を読み込めませんでした');
    return;
  }
  msg.style.display = 'none';
  draw();
  loadStatus();
  setInterval(loadStatus, STATUS_INTERVAL_SEC * 1000);
}

// 遅れ・運休の推定を取り直す。取れないときは何も出さない（平常時と同じ見た目）
async function loadStatus() {
  try {
    const res = await fetch(GAS_URL + '?type=status');
    const d = await res.json();
    if (d.error || !d.patterns) throw new Error(d.error || 'empty');
    status = d.patterns;
    statusAt = d.updated ? new Date(d.updated) : new Date();
  } catch (e) {
    console.error(e);
    return;
  }
  restyle();
  data.stops.forEach(s => pins[s.id].setIcon(pinIcon(s)));
  updateDelayButton();
  if (sheet.style.display === 'block') { if (currentStop) openStop(currentStop); else if (delayMode) showDelays(); else if (query) showResults(); }
}

function stopLabel(s) { return s.name + (s.num ? ` ${s.num}番乗り場` : ''); }

function pinIcon(s) {
  const cls = ['pin'];
  if (s.id === selStop) cls.push('sel');
  if (s.routes.some(isAlert)) cls.push('alert');
  return L.divIcon({ className:'', iconSize:[0,0], iconAnchor:[0,0],
    html:`<div class="${cls.join(' ')}"><i>${esc(s.num || '●')}</i><span>${esc(s.name)}</span></div>` });
}

function draw() {
  // 系統名（例：王40）ごとに色を決める
  const titles = [...new Set(data.routes.map(r => r.title))].sort();
  titles.forEach((t, i) => colorOf[t] = PALETTE[i % PALETTE.length]);

  // 探すときに使う名前：系統名・行き先・途中の停留所名
  data.routes.forEach((r, i) => {
    const names = [r.title, r.note, r.dest];
    (data.along || []).forEach(a => { if (a.routes.includes(i)) names.push(a.name); });
    data.stops.forEach(s => { if (s.routes.includes(r.id)) names.push(s.name); });
    r.names = names.map(norm).join('|');
  });

  data.routes.forEach(r => {
    lines[r.id] = L.polyline(r.path, { color:colorOf[r.title], weight:5, opacity:.8 })
      .addTo(map).on('click', () => highlight(r.id));
  });

  const bounds = [];
  data.stops.forEach(s => {
    stopById[s.id] = s;
    pins[s.id] = L.marker([s.lat, s.lng], { icon:pinIcon(s), title:stopLabel(s) }).on('click', () => openStop(s));
    cluster.addLayer(pins[s.id]);
    bounds.push([s.lat, s.lng]);
  });
  // 線の途中のバス停：小さな丸。押すと停留所名と通る路線が出る
  (data.along || []).forEach(a => {
    const s = { id:null, name:a.name, num:'', along:true, routes:a.routes.map(i => data.routes[i] && data.routes[i].id).filter(Boolean) };
    s.marker = L.circleMarker([a.lat, a.lng], { renderer:alongRenderer, radius:6, weight:2, color:'#222', fillColor:'#fff', fillOpacity:1 })
      .on('click', () => openStop(s));
    along.push(s);
  });
  map.on('zoomend', applyFilter);

  if (bounds.length) map.fitBounds(bounds, { padding:[40,40], maxZoom:17 });
  applyFilter();
}

// 向き・★の設定に合わせて、線と途中のバス停を出し入れする
function applyFilter() {
  document.getElementById('dirFrom').classList.toggle('on', dir === 'from');
  document.getElementById('dirTo').classList.toggle('on', dir === 'to');
  document.getElementById('favOnly').classList.toggle('on', favOnly);
  data.routes.forEach(r => {
    const l = lines[r.id];
    if (isVisible(r)) { if (!map.hasLayer(l)) l.addTo(map); }
    else if (map.hasLayer(l)) l.remove();
  });
  const showAlong = map.getZoom() >= 15;
  along.forEach(s => {
    const on = showAlong && s.routes.some(id => isVisible(routeById(id)));
    if (on && !map.hasLayer(s.marker)) s.marker.addTo(map);
    else if (!on && map.hasLayer(s.marker)) s.marker.remove();
  });
  if (selRoute && !isVisible(routeById(selRoute))) selRoute = null;
  restyle();
  updateDelayButton();
  if (sheet.style.display === 'block') { if (currentStop) openStop(currentStop); else if (delayMode) showDelays(); else if (query) showResults(); }
}

document.getElementById('dirFrom').onclick = () => { dir = 'from'; savePref('dir', dir); applyFilter(); };
document.getElementById('dirTo').onclick = () => { dir = 'to'; savePref('dir', dir); applyFilter(); };
document.getElementById('favOnly').onclick = () => {
  favOnly = !favOnly; savePref('favOnly', favOnly);
  if (favOnly && !favs.size) showMsgFor('乗り場や路線を押して、よく使う路線に★を付けてください');
  applyFilter();
};
function toggleFav(title) {
  favs.has(title) ? favs.delete(title) : favs.add(title);
  savePref('favs', [...favs]);
  applyFilter();
}
function showMsgFor(t) { showMsg(t); setTimeout(() => { msg.style.display = 'none'; }, 3500); }

function openStop(s) {
  currentStop = s; delayMode = false;
  const prev = selStop;
  selStop = s.id;
  if (prev && prev !== s.id) pins[prev].setIcon(pinIcon(stopById[prev]));
  if (s.id) pins[s.id].setIcon(pinIcon(s));

  // ★を付けた系統を上に、あとは系統名の順
  const rs = s.routes.map(routeById).filter(r => r && isVisible(r))
    .sort((a, b) => (favs.has(b.title) - favs.has(a.title)) || a.title.localeCompare(b.title, 'ja'));
  const anySuspended = rs.some(r => isSuspended(r.id));
  sheet.innerHTML = `<h2>${esc(stopLabel(s))}<button id="close">閉じる</button></h2>` +
    (rs.length ? rs.map(r => {
       const c = isAlert(r.id) ? ALERT : colorOf[r.title];
       const fav = favs.has(r.title);
       return `<div class="row"><button class="route" data-id="${esc(r.id)}" style="border-color:${c}">
         <i class="chip" style="background:${c}"></i><b>${esc(r.title)}</b><span>${esc(destOf(r))}</span>${alertText(r.id) ? `<em>${esc(alertText(r.id))}</em>` : ''}</button>
         <button class="star${fav ? ' on' : ''}" data-title="${esc(r.title)}" aria-label="${esc(r.title)}をよく使う路線にする">${fav ? '★' : '☆'}</button></div>`;
     }).join('') : `<p>${favOnly ? '★を付けた路線はこの乗り場を通りません' : (dir === 'from' ? 'ここから王子駅を出る路線はありません' : 'ここから王子駅へ向かう路線はありません')}</p>`) +
    (anySuspended ? '<p class="note">※ 走っているはずのバスが位置データに見当たらないため、運休と推測しています。実際の運行とは異なる場合があります。</p>' : '');
  sheet.style.display = 'block';
  sheet.querySelectorAll('.route').forEach(b => b.onclick = () => highlight(b.dataset.id));
  sheet.querySelectorAll('.star').forEach(b => b.onclick = () => toggleFav(b.dataset.title));
  document.getElementById('close').onclick = closeStop;
  markRoute();
  map.invalidateSize();
}

function closeStop() {
  currentStop = null; delayMode = false;
  const prev = selStop;
  selStop = null;
  if (prev) pins[prev].setIcon(pinIcon(stopById[prev]));
  sheet.style.display = 'none';
  highlight(null);
  map.invalidateSize();
}

// 路線をタップ：その路線だけ強調。もう一度タップで元に戻す
function highlight(id) {
  selRoute = (id && id !== selRoute) ? id : null;
  restyle();
  markRoute();
}

// 線の色と太さ：遅れ・運休の可能性がある路線は赤（運休の可能性は点線）
function restyle() {
  Object.entries(lines).forEach(([rid, l]) => {
    const r = data.routes.find(x => x.id === rid);
    const color = isAlert(rid) ? ALERT : colorOf[r.title];
    const dashArray = isSuspended(rid) ? '10 8' : null;
    if (!selRoute) l.setStyle({ color, dashArray, weight:5, opacity:.8 });
    else if (rid === selRoute) { l.setStyle({ color, dashArray, weight:9, opacity:1 }); if (map.hasLayer(l)) l.bringToFront(); }
    else l.setStyle({ color, dashArray, weight:3, opacity:.12 });
  });
  // 遅れのある線は上に重ねて見えやすくする
  if (!selRoute) Object.keys(lines).filter(isAlert).forEach(rid => { if (map.hasLayer(lines[rid])) lines[rid].bringToFront(); });
}

function markRoute() {
  sheet.querySelectorAll('.route').forEach(b => b.classList.toggle('on', b.dataset.id === selRoute));
}

load();
</script>
</body>
</html>
